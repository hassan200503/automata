name: Bug report
description: Something does not work the way it should.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Automata is honest about failure — help us be honest about fixes too.

        Before you start: search [existing issues](https://github.com/hassan200503/automata/issues) to avoid duplicates.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Automata
        2. Say "..."
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Automata version
      description: Find it in the title bar, the About panel, or the installer filename.
      placeholder: "0.5.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - NSIS installer from Releases
        - Built from source
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2 (build 22631)"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Anything that helps — paste relevant logs here. Do not include API keys or personal data.
    validations:
      required: false
