name: Release

# Builds the Windows NSIS installer and publishes it to a GitHub Release.
# Trigger it by pushing a version tag (e.g. `git tag v0.5.0 && git push origin v0.5.0`)
# or run it manually from the Actions tab.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. v0.5.0). Leave blank to use the current package.json version."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Build installer
        run: npm run package

      - name: Write checksums
        shell: bash
        run: |
          cd apps/desktop/release
          sha256sum Automata-*-x64.exe | tee SHA256SUMS.txt

      - name: Compose release notes
        shell: bash
        run: |
          cd apps/desktop/release
          printf '## Automata %s\n\nWindows-first, voice-first personal AI companion by HassanTech.\n\n### Download\n\n- `Automata-*-x64.exe` — Windows installer (64-bit)\n- `SHA256SUMS.txt` — checksum for the installer\n\n### Verify your download\n\nThe installer is not code-signed. Before running it, confirm its SHA-256 matches:\n\n```text\n%s\n```\n\nOn Windows, check it in the folder you downloaded it to:\n\n```text\ncertutil -hashfile Automata-*-x64.exe SHA256\n```\n\n> **Windows may show "Windows protected your PC".** Click **More info → Run anyway**, after the hash above matches.\n\nSee [`CHANGELOG.md`](https://github.com/hassan200503/automata/blob/main/CHANGELOG.md) for what changed.\n' "${{ steps.version.outputs.tag }}" "$(cat SHA256SUMS.txt)" > release-notes.md
          cat release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Automata ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          body_path: apps/desktop/release/release-notes.md
          files: |
            apps/desktop/release/Automata-*-x64.exe
            apps/desktop/release/SHA256SUMS.txt
